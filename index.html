<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121318" />
    <meta name="description" content="Chess Forge: openings, tactics, strategy, endgames, puzzles and practice games." />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>Chess Forge</title>
    <style>
      /* Boot splash shown while the app bundle loads (matches the dark theme). */
      html, body { margin: 0; background: #121318; }
      @media (prefers-color-scheme: light) { html, body { background: #f6f4ef; } #splash { background: #f6f4ef; color: #1a1c20; } }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #121318; color: #ece9e1;
        font-family: system-ui, sans-serif; z-index: 9999; transition: opacity .35s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { width: 72px; height: 72px; animation: pulse 1.4s ease-in-out infinite; }
      #splash p { margin: 16px 0 0; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
      @keyframes pulse { 50% { transform: scale(1.06); opacity: .85; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2a65a"/><stop offset="1" stop-color="#c0502a"/></linearGradient></defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sg)"/>
          <path d="M22 48h22c0-9-2-16-6-21l2-6-6 2-4-4-2 6c-4 2-8 6-8 11l4 2 4-4 4 2-8 8z" fill="#fff8ee" stroke="#5a2a0a" stroke-width="2" stroke-linejoin="round"/>
          <rect x="19" y="47" width="28" height="5" rx="2.5" fill="#fff8ee" stroke="#5a2a0a" stroke-width="2"/>
        </svg>
        <p>Chess Forge</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
